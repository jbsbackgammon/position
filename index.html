<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ポジション画像作成</title><link rel="stylesheet" href="match-styles.css"><link rel="stylesheet" href="match-layout.css?v=202610251126"></head><body>
<main class="app"><header class="app-head"><div class="app-head-main"><label class="button primary">XG読込<input id="xgFiles" type="file" accept=".xg,.xgp" multiple></label><h1 id="fileHeading"></h1><div class="app-head-actions"><button id="clearSelection" class="button" type="button" disabled>全選択削除</button><button id="downloadAll" class="button primary" disabled>画像一括出力</button></div></div><div class="app-head-options"><label class="actual-move-toggle"><input id="showBestMove" type="checkbox" checked><span>最善</span><b class="mark-sample best-mark">★</b></label><label class="actual-move-toggle"><input id="showActualMove" type="checkbox" checked><span>実戦</span><b class="mark-sample actual-mark">✓</b></label><label class="actual-move-toggle"><input id="showSelectionBand" type="checkbox" checked><span>選択帯</span></label><span class="option-separator" aria-hidden="true"></span><label class="actual-move-toggle"><input id="moveAfterNormal" name="moveAfterStyle" type="radio" value="normal" checked><span>ムーブ後通常</span></label><label class="actual-move-toggle"><input id="moveAfterGold" name="moveAfterStyle" type="radio" value="gold"><span>ムーブ後金</span></label><span class="option-separator" aria-hidden="true"></span><label class="actual-move-toggle"><input id="exportSvg" type="checkbox" checked><span>SVG出力(推奨)</span></label><label class="actual-move-toggle"><input id="exportPng" type="checkbox"><span>PNG出力</span></label></div></header><aside class="sidebar"><div id="fileNames" hidden></div><div id="eventList" class="event-list"></div></aside>
<section class="output"><nav class="position-nav" aria-label="選択中ポジション切替"><button id="prevPosition" type="button" aria-label="前のポジション" disabled>＜</button><span id="positionNavLabel"></span><button id="nextPosition" type="button" aria-label="次のポジション" disabled>＞</button></nav><div id="message" class="message"></div><div id="preview" class="preview empty-preview"></div></section></main>
<style>.app{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.side-head h1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.88rem}.preview{grid-template-columns:minmax(0,702px);justify-content:center}.analysis canvas{width:min(100%,594px);margin-inline:auto}.position-set{display:grid;gap:18px;padding-bottom:24px;border-bottom:2px solid #d4dde6}.position-set:last-child{padding-bottom:0;border-bottom:0}.list-column-headings{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:52px minmax(0,1fr) 52px minmax(0,1fr);border-bottom:1px solid #d4dde6;background:#fff;box-shadow:0 1px 3px #0002}.player-heading{grid-column:span 2;padding:8px 6px;font-size:.72rem;font-weight:800;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.black-player{background:#111;color:#fff}.white-player{border:1px solid #aeb8c2;background:#fff;color:#111}.game-title{position:static;padding-block:6px;background:#dce4ec;color:#33485d}.game-grid{display:grid;grid-template-columns:52px minmax(0,1fr) 52px minmax(0,1fr);border-top:1px solid #cbd3dc;border-left:1px solid #cbd3dc}.action-cell,.cube-cell{height:32px;min-width:0;border-right:1px solid #cbd3dc;border-bottom:1px solid #cbd3dc}.action-cell.inactive-cell,.cube-cell.inactive-cell{border-color:#cbd3dc;background:#f3f4f5}.action-cell .event-button{display:flex;width:100%;height:31px;padding:0 5px;align-items:center;flex-direction:row;justify-content:flex-start;overflow:hidden}.action-cell .event-main{display:block;min-width:0;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.68rem}.cube-cell{display:flex;align-items:center;justify-content:center}.cube-choice{display:flex;width:100%;height:31px;padding:0;align-items:center;justify-content:center;border:0;background:#fff;cursor:pointer}.cube-token{display:flex;width:30px;height:30px;align-items:center;justify-content:center;border:1.5px solid #26394d;border-radius:3px;color:#111;font:700 12px/1 Arial,sans-serif}.cube-choice.active{background:#203950}.cube-choice.active .cube-token{border-color:#fff;color:#fff}.cube-choice.inactive{background:#f3f4f5;cursor:default;opacity:.42}.dice-pair{display:flex;flex:none;justify-content:flex-start;width:63px;gap:3px;margin:0 5px 0 0}.mini-die{display:grid;width:30px;height:30px;padding:4px;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:0;border-radius:3px;background:#000}.mini-die i{display:block;width:4px;height:4px;align-self:center;justify-self:center;border-radius:50%;background:transparent}.mini-die i.on{background:#fff}.mini-die.white{border:1px solid #88929d;background:#fff}.mini-die.white i.on{background:#000}.event-button.active .mini-die{outline:1px solid #fff}.event-button.active .mini-die.white{outline:1px solid #111}@media(max-width:920px){.app{grid-template-columns:1fr}.game-grid,.list-column-headings{grid-template-columns:52px minmax(170px,1fr) 52px minmax(170px,1fr);min-width:444px}}</style>
<style>.analysis canvas{width:min(100%,702px)}.action-cell,.cube-cell,.action-cell .event-button,.cube-choice{background:#fff}.sidebar,.sidebar button,.side-head h1,.player-heading,.game-title,.action-cell .event-main,.cube-token,.sidebar .empty{font-size:14px}.action-cell .event-main{font-weight:700}.action-cell .event-button{position:relative}.selection-corner{position:absolute;top:0;right:0;width:16px;height:16px;clip-path:polygon(0 0,100% 0,100% 100%);background:#f2c14e;color:#111;pointer-events:none}.selection-corner b{position:absolute;top:0;right:1px;font:700 8px/10px Arial,sans-serif}.cube-token,.mini-die{width:28px;height:28px;border:1px solid #26394d}.action-cell.inactive-cell,.cube-cell.inactive-cell,.cube-choice.inactive{background:#f3f4f5}.cube-choice.inactive{opacity:1}.cube-choice.inactive .cube-token{visibility:hidden}.dice-pair{width:59px}.list-column-headings,.game-grid{grid-template-columns:32px minmax(0,1fr) 32px minmax(0,1fr)}.cube-cell,.cube-choice{align-items:center;justify-content:center}.event-button.active,.cube-choice.active{background:#203950}.event-button.error-green{color:#159447}.event-button.error-orange{color:#e77700}.event-button.error-red{color:#d82020}.cube-choice.error-green .cube-token{border-color:#159447;color:#159447}.cube-choice.error-orange .cube-token{border-color:#e77700;color:#e77700}.cube-choice.error-red .cube-token{border-color:#d82020;color:#d82020}</style>
<style>body,button,input,select,textarea,.cube-token,.selection-corner b{font-family:Arial,"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif!important}.side-head{justify-content:flex-start}.side-head h1{margin-right:auto;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;line-height:1.35}.output-head{justify-content:flex-start}.output-head>div{display:flex;align-items:center;gap:14px}.actual-move-toggle{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:#33485d;cursor:pointer}.actual-move-toggle input{width:16px;height:16px;margin:0;accent-color:#203950}.list-column-headings,.position-nav{height:34px}.player-heading{display:flex;align-items:center;justify-content:center;padding:0 6px}.position-nav{position:relative;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #d4dde6;background:#fff}.position-nav button{position:absolute;top:0;width:34px;height:33px;padding:0;border:0;background:#fff;color:#203950;font-size:20px;font-weight:700;cursor:pointer}.position-nav #prevPosition{left:0}.position-nav #nextPosition{right:0}.position-nav button:disabled{color:#b8c0c8;cursor:default}.position-nav span{text-align:center;font-size:14px;font-weight:700;color:#33485d}.cube-choice{position:relative}.selection-corner{width:22px;height:22px}.selection-corner b{top:1px;right:2px;font-size:9px;line-height:11px}</style>
<style>.app{width:min(1200px,calc(100% - 28px))}.event-button.active,.cube-choice.active{background:#075fc6}.cube-token,.cube-choice.active .cube-token{background:#fff}.cube-choice.active .cube-token{border-color:#26394d;color:#111}.cube-choice.active.error-green .cube-token{border-color:#159447;color:#159447}.cube-choice.active.error-red .cube-token{border-color:#d82020;color:#d82020}</style>
<style>.inactive-cube-fill{display:block;width:100%;height:100%;background:#f3f4f5}</style><script src="match-app.js?v=202610260132"></script></body></html>
